name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-unit:
    name: API unit checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API deps
        run: npm ci
      - name: Run helper tests
        run: |
          node _lib/djHandles.test.js
          node _lib/meetingSecurity.test.js
          node _lib/portalTokens.test.js
          node _lib/rateLimit.test.js
          node _lib/turnstile.test.js
      - name: Hobby function cap (≤12)
        run: |
          count=$(find . -type f -name '*.js' ! -path './_lib/*' ! -path './node_modules/*' ! -name '*.test.js' | wc -l)
          echo "Serverless function files: $count"
          test "$count" -le 12

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # Build must not require secrets; placeholders keep Vite happy if referenced.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-placeholder
